<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas README frame</title>
<style>
  html,body { margin:0; padding:0; }
  #header { position:relative; width:840px; height:320px; overflow:hidden; }
  #background { display:block; width:840px; height:320px; }
  #sphere { position:absolute; top:48px; left:572px; width:220px; height:220px; }
  canvas { display:block; width:100%; height:100%; }
  #status { font:16px monospace; margin:32px; }
</style>
<div id="header"><img id="background" alt="Header background"><div id="sphere"><canvas></canvas></div></div>
<p id="status">Rendering</p>
<script src="three.min.js"></script>
<script src="atlas-core.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'light' ? 'light' : 'dark';
  const frame = Math.max(0, Math.min(95, Number(params.get('frame')) || 0));
  const background = document.querySelector('#background');
  document.body.style.backgroundColor = theme === 'light' ? '#fcfcfa' : '#07080d';
  document.querySelector('#status').style.color = theme === 'light' ? '#24292f' : '#c9d1d9';
  background.src = '../../assets/header' + (theme === 'light' ? '-light' : '') + '.svg';
  background.decode().then(() => {
    const sphere = AtlasCore.mount({hero:document.querySelector('#sphere'), canvas:document.querySelector('canvas'), capturePhase:frame/96});
    if (!sphere) throw new Error('WebGL renderer unavailable');
    // Allow the compositor to present this frame before the browser captures it.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelector('#status').textContent = 'Ready: ' + theme + ' / ' + frame;
    }));
  }).catch(error => { document.querySelector('#status').textContent = 'Failed: ' + error.message; });
</script>
</html>
