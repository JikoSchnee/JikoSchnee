name: Update profile cards

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile.py
      - scripts/atlas/typeface.json
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/profile.py stats
      - name: Commit only changed cards
        run: |
          git add assets/stats-overview*.svg assets/stats-languages*.svg assets/stats-contributions*.svg
          if git diff --cached --quiet; then
            echo "Statistics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh public GitHub statistics"
          git push
